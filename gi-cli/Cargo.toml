[package]
name = "gi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "gi — a decentralized issue tracker. Issues are markdown files committed alongside your code, with a CLI and a Kanban TUI."
keywords = ["issue-tracker", "git", "cli", "kanban", "tui"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"

[[bin]]
name = "gi"
path = "src/main.rs"

[dependencies]
gi-core = { path = "../gi-core", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = "0.29"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
