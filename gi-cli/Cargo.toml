[package]
name = "gi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gi"
path = "src/main.rs"

[dependencies]
gi-core = { path = "../gi-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
